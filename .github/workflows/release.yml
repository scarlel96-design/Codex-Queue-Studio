name: Publish preview releases

on:
  push:
    branches: [main]
    paths:
      - .release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.release-candidate' -Raw).Trim()
          if ($version -notmatch '^3\.(1|2)\.0$') { throw 'Only preview 3.1.0 and 3.2.0 are allowed' }
          $source = Get-Content 'core.go' -Raw
          if (!$source.Contains('const AppVersion = "' + $version + '"')) { throw 'Release version does not match AppVersion' }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Static checks failed' }
      - name: Build native Windows GUI and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Icon dependency installation failed' }
          python assets/build_resources.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon resource generation failed' }
          go build -ldflags '-H windowsgui -s -w' -o CodexQueueStudio.exe .
          if ($LASTEXITCODE -ne 0) { throw 'GUI build failed' }
          go build -ldflags '-H windowsgui -s -w' -o CodexQueueUpdater.exe ./cmd/updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed' }
      - name: Obtain verified official Codex engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'CodexQueueStudio-Release' }
          $release = Invoke-RestMethod 'https://api.github.com/repos/openai/codex/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'codex-x86_64-pc-windows-msvc.exe.zip' } | Select-Object -First 1
          if (!$asset -or !$asset.digest -or !$asset.digest.StartsWith('sha256:')) { throw 'Official Codex engine digest missing' }
          Invoke-WebRequest $asset.browser_download_url -OutFile 'codex-engine.zip' -Headers $headers
          $digest = (Get-FileHash 'codex-engine.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $asset.digest.Substring(7).ToLowerInvariant()) { throw 'Official Codex engine digest mismatch' }
          Expand-Archive 'codex-engine.zip' -DestinationPath 'codex-runtime' -Force
          $binary = Get-ChildItem 'codex-runtime' -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -match '^codex(-x86_64-pc-windows-msvc)?\.exe$' } | Select-Object -First 1
          if (!$binary) { throw 'Official Codex engine executable missing' }
          New-Item -ItemType Directory -Force -Path 'full/engine' | Out-Null
          Copy-Item $binary.FullName 'full/engine/codex.exe'
      - name: Assemble two release ZIP assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.release-candidate' -Raw).Trim()
          New-Item -ItemType Directory -Force -Path 'full','update' | Out-Null
          $names = @('CodexQueueStudio.exe','CodexQueueUpdater.exe')
          $hashes = @{}
          foreach ($name in $names) {
            Copy-Item $name (Join-Path 'full' $name)
            Copy-Item $name (Join-Path 'update' $name)
            $hashes[$name] = (Get-FileHash (Join-Path 'update' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest = @{ version = $version; files = $hashes } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'update/update-manifest.json'), $manifest, [Text.UTF8Encoding]::new($false))
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md 'full/'
          Copy-Item .release-candidate 'full/VERSION'
          New-Item -ItemType Directory -Force -Path 'full/assets' | Out-Null
          Copy-Item assets/icon.ico,assets/icon.png 'full/assets/'
          Compress-Archive -Path 'full/*' -DestinationPath 'CodexQueueStudio-Windows-x64.zip' -CompressionLevel Optimal
          Compress-Archive -Path 'update/*' -DestinationPath 'CodexQueueStudio-update-Windows-x64.zip' -CompressionLevel Optimal
          foreach ($name in @('CodexQueueStudio-Windows-x64.zip','CodexQueueStudio-update-Windows-x64.zip')) {
            if (!(Test-Path $name) -or (Get-Item $name).Length -lt 100000) { throw "Invalid asset: $name" }
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) 'CodexQueueStudio-update-Windows-x64.zip'))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if (($entries -join ',') -ne 'CodexQueueStudio.exe,CodexQueueUpdater.exe,update-manifest.json') { throw 'Update ZIP contract violated' }
          } finally { $zip.Dispose() }
      - name: Publish prerelease and exactly two ZIP assets
        uses: softprops/action-gh-release@v2.5.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Codex Queue Studio preview ${{ env.RELEASE_TAG }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CodexQueueStudio-Windows-x64.zip
            CodexQueueStudio-update-Windows-x64.zip
      - name: Verify published assets through GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release API fetch failed' }
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($names -join ',') -ne 'CodexQueueStudio-Windows-x64.zip,CodexQueueStudio-update-Windows-x64.zip') { throw "Unexpected GitHub assets: $($names -join ',')" }
          foreach ($asset in $release.assets) {
            if (!$asset.digest -or !$asset.digest.StartsWith('sha256:') -or $asset.size -lt 100000) { throw "Missing digest: $($asset.name)" }
          }
