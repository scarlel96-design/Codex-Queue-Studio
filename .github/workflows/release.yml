name: Publish preview release
on:
  push:
    branches: [main]
    paths:
      - .release-candidate
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify version and run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.release-candidate' -Raw).Trim()
          if ($version -notmatch '^3\.3\.0$') { throw 'Only the validated 3.3.0 preview is enabled' }
          $source = Get-Content core.go -Raw
          if (!$source.Contains('const AppVersion = "' + $version + '"')) { throw 'Version mismatch' }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
      - name: Compile Windows native GUI and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Build-only Pillow installation failed' }
          python assets/build_resources.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource build failed' }
          go build -ldflags '-H windowsgui -s -w' -o CodexQueueStudio.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI build failed' }
          go build -ldflags '-H windowsgui -s -w' -o CodexQueueUpdater.exe ./cmd/updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed' }
      - name: Retrieve official Codex engine with SHA-256 verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'CodexQueueStudio-Release' }
          $latest = Invoke-RestMethod 'https://api.github.com/repos/openai/codex/releases/latest' -Headers $headers
          $asset = $latest.assets | Where-Object { $_.name -eq 'codex-x86_64-pc-windows-msvc.exe.zip' } | Select-Object -First 1
          if (!$asset -or !$asset.digest -or !$asset.digest.StartsWith('sha256:')) { throw 'Official Codex runtime digest missing' }
          Invoke-WebRequest $asset.browser_download_url -OutFile 'codex-engine.zip' -Headers $headers
          if ((Get-FileHash 'codex-engine.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.digest.Substring(7).ToLowerInvariant()) { throw 'Official runtime checksum mismatch' }
          Expand-Archive 'codex-engine.zip' -DestinationPath 'codex-runtime' -Force
          $exe = Get-ChildItem 'codex-runtime' -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -match '^codex(-x86_64-pc-windows-msvc)?\.exe$' } | Select-Object -First 1
          if (!$exe) { throw 'Codex runtime missing' }
          New-Item -ItemType Directory -Force -Path 'full/engine' | Out-Null
          Copy-Item $exe.FullName 'full/engine/codex.exe'
      - name: Assemble full and update ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.release-candidate' -Raw).Trim()
          New-Item -ItemType Directory -Force -Path update,full | Out-Null
          foreach ($name in @('CodexQueueStudio.exe','CodexQueueUpdater.exe')) {
            Copy-Item $name (Join-Path update $name)
            Copy-Item $name (Join-Path full $name)
          }
          $checks = @{}
          foreach ($name in @('CodexQueueStudio.exe','CodexQueueUpdater.exe')) {
            $checks[$name] = (Get-FileHash (Join-Path update $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest = @{ version = $version; files = $checks } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'update/update-manifest.json'),$manifest,[Text.UTF8Encoding]::new($false))
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md full/
          New-Item -ItemType Directory -Force -Path 'full/assets' | Out-Null
          Copy-Item assets/icon.ico,assets/icon.png full/assets/
          Compress-Archive -Path full/* -DestinationPath 'CodexQueueStudio-Windows-x64.zip' -CompressionLevel Optimal
          Compress-Archive -Path update/* -DestinationPath 'CodexQueueStudio-update-Windows-x64.zip' -CompressionLevel Optimal
          foreach ($name in @('CodexQueueStudio-Windows-x64.zip','CodexQueueStudio-update-Windows-x64.zip')) {
            if (!(Test-Path $name) -or (Get-Item $name).Length -lt 100000) { throw "Invalid package: $name" }
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) 'CodexQueueStudio-update-Windows-x64.zip'))
          try {
            $actual = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if (($actual -join ',') -ne 'CodexQueueStudio.exe,CodexQueueUpdater.exe,update-manifest.json') { throw "Update file contract violation" }
          } finally { $zip.Dispose() }
      - name: Publish exactly two pre-release assets
        uses: softprops/action-gh-release@v2.5.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Codex Queue Studio ${{ env.RELEASE_TAG }} Preview
          prerelease: true
          make_latest: false
          body_path: docs/RELEASE_3_3.md
          fail_on_unmatched_files: true
          files: |
            CodexQueueStudio-Windows-x64.zip
            CodexQueueStudio-update-Windows-x64.zip
      - name: Validate uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release lookup failed' }
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @('CodexQueueStudio-Windows-x64.zip','CodexQueueStudio-update-Windows-x64.zip')
          if ($names.Count -ne 2 -or @(Compare-Object -ReferenceObject $expected -DifferenceObject $names).Count -ne 0) { throw 'Incorrect release asset list' }
          foreach ($asset in $release.assets) {
            if ($asset.size -lt 100000 -or !$asset.digest -or !$asset.digest.StartsWith('sha256:')) { throw 'Release asset SHA-256 missing' }
          }
