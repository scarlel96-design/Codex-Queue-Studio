name: Release Windows app
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        shell: pwsh
        run: go test ./...
      - name: Compile native applications
        shell: pwsh
        run: |
          go build -ldflags "-H windowsgui -s -w" -o CodexQueueStudio.exe .
          go build -ldflags "-H windowsgui -s -w" -o CodexQueueUpdater.exe ./cmd/updater
      - name: Download and verify official Codex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'CodexQueueStudio-Release' }
          $release = Invoke-RestMethod 'https://api.github.com/repos/openai/codex/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'codex-x86_64-pc-windows-msvc.exe.zip' } | Select-Object -First 1
          if (!$asset) { throw 'Official Windows x64 Codex archive unavailable' }
          if (!$asset.digest -or !$asset.digest.StartsWith('sha256:')) { throw 'Missing official SHA-256 digest' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'codex-engine.zip' -Headers $headers
          $hash = (Get-FileHash 'codex-engine.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $asset.digest.Substring(7).ToLowerInvariant()) { throw 'Codex binary digest mismatch' }
          Expand-Archive 'codex-engine.zip' -DestinationPath 'codex-runtime' -Force
          $exe = Get-ChildItem -Path 'codex-runtime' -Recurse -Filter '*.exe' | Where-Object { $_.Name -match '^codex(-x86_64-pc-windows-msvc)?\.exe$' } | Select-Object -First 1
          if (!$exe) { throw 'Codex executable missing from verified archive' }
          New-Item -ItemType Directory -Force -Path 'release/engine' | Out-Null
          Copy-Item $exe.FullName 'release/engine/codex.exe'
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item CodexQueueStudio.exe release/
          Copy-Item CodexQueueUpdater.exe release/
          Copy-Item README.md release/
          Copy-Item LICENSE release/
          Copy-Item THIRD_PARTY_NOTICES.md release/
          Copy-Item assets/icon.ico release/
          Compress-Archive -Path release/* -DestinationPath CodexQueueStudio-Windows-x64.zip -CompressionLevel Optimal
          $h = (Get-FileHash CodexQueueStudio-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  CodexQueueStudio-Windows-x64.zip" | Out-File -Encoding ascii CodexQueueStudio-Windows-x64.zip.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CodexQueueStudio-Windows-x64.zip
            CodexQueueStudio-Windows-x64.zip.sha256
