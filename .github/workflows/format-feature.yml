name: Format v3.4 changed Go sources
on:
  push:
    branches: [feature/v3.4-native-session-provider-ui]
    paths: [.format-request]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-native-session-provider-ui
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go modules
        run: |
          gofmt -w main_windows.go relay_ui_windows.go relay_selectors_windows.go explorer_ui_windows.go chat_core.go relay_core.go internal/providers.go internal/provider_openai.go internal/providers_test.go internal/relay.go internal/store.go
          git diff --check
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_windows.go relay_ui_windows.go relay_selectors_windows.go explorer_ui_windows.go chat_core.go relay_core.go internal/providers.go internal/provider_openai.go internal/providers_test.go internal/relay.go internal/store.go
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt v3.4 native UI and provider modules"
            git push origin HEAD:feature/v3.4-native-session-provider-ui
          fi
